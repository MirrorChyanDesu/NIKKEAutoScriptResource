name: Build and Release NKAS Resource

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Read Resource Version
        id: version
        run: echo "version=$(jq -er '.version' version.json)" >> "$GITHUB_OUTPUT"

      - name: Pack Resources
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: zip -r -9 "NKAS_Resource_v${VERSION}.zip" maps models version.json README.md

      - name: Create Release and Upload
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844  # v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NKAS Resource v${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: NKAS_Resource_v${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
